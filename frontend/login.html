<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Suncloud Portal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        /* Chỉ giữ lại CSS đặc thù của riêng component login này */
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            background: white;
        }
        .brand-text {
            color: var(--primary-color, #0d6efd);
            font-weight: bold;
            font-size: 1.75rem;
            text-align: center;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="login-card">
        <div class="brand-text">
            <a href="index.html" class="text-decoration-none"><i class="bi bi-cloud-fill"></i> Suncloud</a>
        </div>
        
        <div id="alert-msg" class="alert d-none" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Tài khoản</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-semibold">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
                </div>
            </div>

            <div class="mb-4 text-end">
                <a href="reset-pass.html" class="text-decoration-none small text-muted hover-primary">
                    Quên mật khẩu?
                </a>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                Đăng Nhập
            </button>

            <div class="text-center">
                <span class="small text-secondary">Chưa có tài khoản?</span>
                <a href="register.html" class="text-decoration-none small fw-semibold ms-1">Đăng ký ngay</a>
            </div>
        </form>
    </div>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
