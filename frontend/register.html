<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Suncloud Portal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        /* Chỉ giữ lại CSS đặc thù của riêng component register này */
        .register-card {
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            background: white;
        }
        .brand-text {
            color: var(--primary-color, #0d6efd);
            font-weight: bold;
            font-size: 1.75rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="register-card">
        <div class="brand-text">
            <a href="index.html" class="text-decoration-none"><i class="bi bi-cloud-fill"></i> Suncloud</a>
        </div>
        <p class="text-muted text-center mb-4">Tạo tài khoản Khách hàng mới</p>
        
        <div id="register-alert" class="alert d-none" role="alert"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên đăng nhập <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="reg-username" class="form-control" placeholder="Nhập tên tài khoản (viết liền không dấu)" required minlength="4">
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="reg-password" class="form-control" placeholder="Tối thiểu 6 ký tự" required minlength="6">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" id="reg-confirm-password" class="form-control" placeholder="Nhập lại mật khẩu" required minlength="6">
                </div>
            </div>

            <button type="submit" id="registerBtn" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                Tạo Tài Khoản
            </button>

            <div class="text-center">
                <span class="small text-secondary">Đã có tài khoản?</span>
                <a href="login.html" class="text-decoration-none small fw-semibold ms-1">Đăng nhập tại đây</a>
            </div>
        </form>
    </div>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const registerForm = document.getElementById("registerForm");
            const alertBox = document.getElementById("register-alert");
            const registerBtn = document.getElementById("registerBtn");

            registerForm.addEventListener("submit", async (e) => {
                e.preventDefault(); // Ngăn trình duyệt tải lại trang

                const username = document.getElementById("reg-username").value.trim();
                const password = document.getElementById("reg-password").value;
                const confirmPassword = document.getElementById("reg-confirm-password").value;

                // Reset thông báo
                alertBox.classList.add("d-none");

                // Kiểm tra mật khẩu khớp nhau (Validation Frontend)
                if (password !== confirmPassword) {
                    alertBox.className = "alert alert-warning";
                    alertBox.textContent = "Mật khẩu xác nhận không khớp. Vui lòng kiểm tra lại.";
                    alertBox.classList.remove("d-none");
                    return;
                }

                // Vô hiệu hóa nút bấm trong lúc chờ API
                registerBtn.disabled = true;
                registerBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý...';

                try {
                    // Gọi API đăng ký (Chuyển body sang JSON theo yêu cầu của Backend)
                    const requestBody = {
                        username: username,
                        password: password,
                        is_active: true
                    };

                    const response = await apiClient.fetch("/auth/register", {
                        method: "POST",
                        body: JSON.stringify(requestBody)
                    });

                    // Hiển thị thành công và đếm ngược chuyển hướng
                    alertBox.className = "alert alert-success";
                    alertBox.innerHTML = '<strong>Đăng ký thành công!</strong> Hệ thống đang chuyển hướng tới trang Đăng nhập...';
                    alertBox.classList.remove("d-none");
                    
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);

                } catch (error) {
                    // Xử lý lỗi (ví dụ: Trùng username)
                    alertBox.className = "alert alert-danger";
                    alertBox.textContent = error.message || "Đã xảy ra lỗi hệ thống. Vui lòng thử lại.";
                    alertBox.classList.remove("d-none");
                } finally {
                    // Bật lại nút bấm nếu có lỗi
                    if (!alertBox.classList.contains("alert-success")) {
                        registerBtn.disabled = false;
                        registerBtn.innerText = "Tạo Tài Khoản";
                    }
                }
            });
        });
    </script>
</body>
</html>
