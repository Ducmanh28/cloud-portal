<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Suncloud Portal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        /* Chỉ giữ lại CSS đặc thù của riêng component reset này */
        .reset-card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            background: white;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="reset-card">
        <h4 class="fw-bold mb-3 text-center">Đặt lại mật khẩu</h4>
        <p class="text-muted small text-center mb-4">Điền tên tài khoản của bạn để tiến hành thiết lập lại mật khẩu truy cập hệ thống.</p>
        
        <div id="reset-alert" class="alert d-none" role="alert"></div>

        <form id="requestTokenForm">
            <div class="mb-4">
                <label class="form-label fw-semibold">Tài khoản</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="reset-username" class="form-control" placeholder="Nhập tên tài khoản cần khôi phục" required>
                </div>
            </div>
            <button type="submit" id="sendTokenBtn" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                Gửi mã xác nhận
            </button>
        </form>

        <form id="confirmResetForm" class="d-none">
            <div class="mb-3">
                <label class="form-label fw-semibold">Mã xác nhận (Token)</label>
                <input type="text" id="reset-token" class="form-control" placeholder="Dán mã Token nhận được" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Mật khẩu mới</label>
                <input type="password" id="new-password" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
            </div>
            <button type="submit" id="submitNewPassBtn" class="btn btn-success w-100 py-2 fw-semibold mb-3">
                Xác nhận đổi mật khẩu
            </button>
        </form>

        <div class="text-center mt-2">
            <a href="login.html" class="text-decoration-none small fw-semibold">
                <i class="bi bi-arrow-left"></i> Quay lại trang đăng nhập
            </a>
        </div>
    </div>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const requestForm = document.getElementById("requestTokenForm");
            const confirmForm = document.getElementById("confirmResetForm");
            const alertBox = document.getElementById("reset-alert");
            
            let targetUsername = "";

            // Xử lý Giai đoạn 1: Gửi yêu cầu cấp Token lên Backend
            requestForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                targetUsername = document.getElementById("reset-username").value;
                
                alertBox.classList.add("d-none");
                
                try {
                    // SỬA Ở ĐÂY: Gửi dữ liệu qua JSON Body thay vì Query Parameter
                    const response = await apiClient.fetch("/auth/forgot-password", {
                        method: "POST",
                        body: JSON.stringify({
                            username: targetUsername
                        })
                    });
                    
                    alertBox.className = "alert alert-success";
                    // Lấy token từ phản hồi để hiển thị cho user (vì hệ thống chưa có tính năng gửi email)
                    const token = response.debug_reset_token || "Chưa lấy được token";
                    alertBox.innerHTML = `Yêu cầu thành công.<br>Mã Token của bạn là: <strong>${token}</strong><br>Vui lòng sao chép mã này để tiếp tục.`;
                    alertBox.classList.remove("d-none");
                    
                    // Chuyển sang hiển thị form Bước 2
                    requestForm.classList.add("d-none");
                    confirmForm.classList.remove("d-none");
                    
                } catch (error) {
                    alertBox.className = "alert alert-danger";
                    alertBox.textContent = error.message;
                    alertBox.classList.remove("d-none");
                }
            });

            // Xử lý Giai đoạn 2: Gửi mã Token kèm mật khẩu mới
            confirmForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const token = document.getElementById("reset-token").value;
                const newPassword = document.getElementById("new-password").value;
                
                alertBox.classList.add("d-none");

                try {
                    // Đảm bảo gửi đúng dữ liệu mà model ResetPasswordRequest yêu cầu
                    await apiClient.fetch("/auth/reset-password", {
                        method: "POST",
                        body: JSON.stringify({
                            token: token,
                            new_password: newPassword
                        })
                    });

                    alertBox.className = "alert alert-success";
                    alertBox.textContent = "Đổi mật khẩu thành công! Hệ thống sẽ chuyển hướng về trang đăng nhập sau 2 giây.";
                    alertBox.classList.remove("d-none");
                    
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2000);

                } catch (error) {
                    alertBox.className = "alert alert-danger";
                    alertBox.textContent = error.message;
                    alertBox.classList.remove("d-none");
                }
            });
        });
    </script>
</body>
</html>
